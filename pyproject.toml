[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bebro-bots"
version = "0.1.0"
description = "Telegram group bots with OpenAI and local SQLite memory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "python-telegram-bot[job-queue]>=21.6",
  "openai>=1.40.0",
  "anthropic>=0.26.0",
  "PyYAML>=6.0.1",
  "python-dotenv>=1.0.1",
  "pydantic>=2.6.0",
  "uvicorn[standard]>=0.30.0",
  "fastapi>=0.111.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.5.0", "pytest>=8.0.0"]

[project.scripts]
bebro-bots = "bebro_bots.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
