# Скопируйте в config.yaml и поправьте. Токены — только через .env (см. token_env).

openai:
  api_key_env: OPENAI_API_KEY
  model: gpt-4o-mini
  base_url: null  # например https://api.openai.com/v1 — по умолчанию клиент OpenAI
  # Суточный лимит prompt-токенов (UTC, все боты и чаты). Учёт в SQLite.
  daily_input_tokens: 650000

anthropic:
  api_key_env: ANTHROPIC_API_KEY
  model: claude-opus-4-6
  # Суточный лимит input-токенов Anthropic (UTC, все боты и чаты).
  daily_input_tokens: 300000
  # Максимум токенов в ответе (Anthropic требует явного max_tokens).
  max_output_tokens: 2048

server:
  webhook_host: "0.0.0.0"
  webhook_port: 8080
  # Базовый URL без слэша; для Cloudflare: https://your-domain.example
  public_base_url: null

# SQLite одним файлом на всех ботов (путь от корня проекта).
sqlite_path: data/bebro.sqlite

# Глобальные суточные лимиты (UTC, все боты и чаты вместе). Учёт в SQLite.
# Лимит токенов — в секции провайдера (openai.daily_input_tokens / anthropic.daily_input_tokens).
limits:
  daily_web_searches: 30
  use_utc_calendar_day: true

# Случайная задержка (мс) перед ответом на обычное сообщение группы — снижает одновременные ответы ботов.
response_jitter_ms_min: 0
response_jitter_ms_max: 8000

# Не чаще одного сообщения в чат об исчерпании лимита на тип (минуты).
limit_notify_cooldown_minutes: 45

# Периодическое саммари после ответа (отдельный вызов модели).
conversation_summary:
  min_messages_in_window: 15
  random_summarize_probability: 0.06

# 1 — мало контекста из предпочтений в промпте; 5 — максимум. По умолчанию 4.
feedback_sensitivity: 5

# Вероятность вызвать LLM без явного @ и без текстового алиаса (0…1). Только из этого файла, не из БД.
reply_probability: 0.8

# Долгие инструкции (add_long_instruction → таблица long_memory).
long_memory:
  retention_days: 90
  context_limit: 25

# Ситуационные правила (add_situation_rule → situation_rules).
situation_rules:
  retention_days: 90
  context_limit: 25
  max_stored: 50

web_search:
  mode: always

vision:
  enabled: true
  max_image_bytes: 20971520
  max_images_per_turn: 6

# chat_id группы (из /bebro_ping). Для супергрупп часто вид -100...
allowed_chat_ids:
  - -5295698188
# Числовой id и/или "@username" в кавычках. Дополнительно: ADMIN_USER_IDS в .env (только числа).
admin_user_ids:
  - "@valex2ev"

# У записи бота нет поля personality — текст личности только в БД (см. SPECIFICATION §7).

vpn_watch:
  enabled: false
  check_interval_seconds: 120
  reconnect_max_attempts: 5
  post_restart_wait_seconds: 15
  windows_service_name: "Adguard VPN Service"
  service_exe_path: "C:\\Program Files\\AdGuardVpn\\AdGuardVpnSvc.exe"
  notify_bot_id: biba

bots:
  - id: biba
    token_env: BEBRO_BIBA_BOT_TOKEN
    username: bebro_biba_bot
    mood_default: "спокойное любопытство"
    # Активный LLM-провайдер для этого бота: openai или anthropic.
    provider: openai

  - id: boba
    token_env: BEBRO_BOBA_BOT_TOKEN
    username: bebro_boba_bot
    mood_default: "лёгкая ирония"
    provider: anthropic
